<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.2)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.05)" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.2)" />
      <stop offset="100%" stop-color="rgba(52, 211, 153, 0.05)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.55; }
    }
    @keyframes floatWave {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 80; }
    }
    @keyframes barWave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1.0); }
    }
    @keyframes nodeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shimmerPill {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5)); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .orb-3 { animation: pulseOrb 7s ease-in-out infinite alternate; transform-origin: 600px 380px; }
    
    .wave-line-1 { animation: floatWave 12s linear infinite; }
    .wave-line-2 { animation: floatWave 16s linear infinite reverse; }

    .node-group { animation: nodeFloat 6s ease-in-out infinite; }
    .pill-shimmer { animation: shimmerPill 4s ease-in-out infinite; }

    .audio-bar { transform-origin: bottom; transform-box: fill-box; }
    .b1 { animation: barWave 1.4s ease-in-out infinite 0.1s; }
    .b2 { animation: barWave 1.1s ease-in-out infinite 0.3s; }
    .b3 { animation: barWave 1.6s ease-in-out infinite 0.5s; }
    .b4 { animation: barWave 1.2s ease-in-out infinite 0.2s; }
    .b5 { animation: barWave 1.5s ease-in-out infinite 0.4s; }
    .b6 { animation: barWave 1.3s ease-in-out infinite 0.6s; }
    .b7 { animation: barWave 1.7s ease-in-out infinite 0.15s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  <rect width="1200" height="420" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <g>
    <circle class="orb-1" cx="200" cy="90" r="180" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="280" r="210" fill="#a855f7" opacity="0.25" filter="url(#glow)" />
    <circle class="orb-3" cx="600" cy="390" r="140" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  </g>

  <!-- Dynamic Audio Soundwaves (Background / Decorative) -->
  <g opacity="0.45">
    <path class="wave-line-1" d="M 0 320 C 250 260, 380 380, 600 320 C 820 260, 950 370, 1200 310" 
          fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-dasharray="10 8" />
    <path class="wave-line-2" d="M 0 340 C 300 390, 420 280, 650 340 C 880 400, 1000 290, 1200 350" 
          fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  </g>

  <!-- Soundwave Visualizer Bars on Left/Right -->
  <g transform="translate(60, 190)" opacity="0.65">
    <rect class="audio-bar b1" x="0" y="0" width="4" height="45" rx="2" fill="#38bdf8" />
    <rect class="audio-bar b2" x="8" y="0" width="4" height="65" rx="2" fill="#60a5fa" />
    <rect class="audio-bar b3" x="16" y="0" width="4" height="90" rx="2" fill="#818cf8" />
    <rect class="audio-bar b4" x="24" y="0" width="4" height="50" rx="2" fill="#a78bfa" />
    <rect class="audio-bar b5" x="32" y="0" width="4" height="75" rx="2" fill="#c084fc" />
    <rect class="audio-bar b6" x="40" y="0" width="4" height="35" rx="2" fill="#e879f9" />
    <rect class="audio-bar b7" x="48" y="0" width="4" height="60" rx="2" fill="#38bdf8" />
  </g>

  <g transform="translate(1080, 190)" opacity="0.65">
    <rect class="audio-bar b7" x="0" y="0" width="4" height="60" rx="2" fill="#c084fc" />
    <rect class="audio-bar b5" x="8" y="0" width="4" height="75" rx="2" fill="#818cf8" />
    <rect class="audio-bar b2" x="16" y="0" width="4" height="40" rx="2" fill="#60a5fa" />
    <rect class="audio-bar b3" x="24" y="0" width="4" height="90" rx="2" fill="#38bdf8" />
    <rect class="audio-bar b1" x="32" y="0" width="4" height="50" rx="2" fill="#34d399" />
    <rect class="audio-bar b4" x="40" y="0" width="4" height="65" rx="2" fill="#818cf8" />
    <rect class="audio-bar b6" x="48" y="0" width="4" height="35" rx="2" fill="#c084fc" />
  </g>

  <!-- FOREGROUND CONTENT: High Z-index, crystal clear readability -->
  <!-- Top Tag pill -->
  <g class="pill-shimmer" transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
      ⚡ THE CURATED AI DIRECTORY
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <!-- Shadow for ultra contrast -->
    <text text-anchor="middle" y="0" fill="#000000" opacity="0.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome AI Meeting Notes
    </text>
    <text text-anchor="middle" y="-2" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#lightGlow)">
      Awesome AI Meeting Notes
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)">
    <text text-anchor="middle" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Transcription • Autonomous Summarization • Action Items • Local First &amp; Enterprise Cloud
    </text>
  </g>

  <!-- Feature Pills Group -->
  <g class="node-group" transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="url(#pillGrad1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <text text-anchor="middle" y="6" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
        🎙️ SOTA Whisper AI
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-105" y="-22" width="210" height="44" rx="22" fill="url(#pillGrad2)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
      <text text-anchor="middle" y="6" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
        🔒 100% Local Ollama
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(120, 0)">
      <rect x="-105" y="-22" width="210" height="44" rx="22" fill="url(#pillGrad1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <text text-anchor="middle" y="6" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
        ⚡ Enterprise SaaS
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(360, 0)">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="url(#pillGrad3)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" />
      <text text-anchor="middle" y="6" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
        🤖 Agentic Workflows
      </text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(600, 360)">
    <line x1="-280" y1="0" x2="280" y2="0" stroke="url(#neonCyan)" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>
</svg>
